# Pre-release validation workflow.
#
# Institutions host this file alongside fair-publish.yml in their
# org-level .github repository:
#   MY-ORG/.github  →  .github/workflows/fair-validate.yml
#
# The institute FAIR policy lives in the same repo:
#   MY-ORG/.github  →  .github/policies/fair-policy.yml
#
# Project repositories call it with no policy override:
#
#   on:
#     push:
#       branches: [main]
#       paths: ["dmp.json"]
#     pull_request:
#       paths: ["dmp.json"]
#   jobs:
#     validate:
#       uses: MY-ORG/.github/.github/workflows/fair-validate.yml@main
#       with:
#         dmp_path: dmp.json

on:
  workflow_call:
    inputs:
      dmp_path:
        description: "Path to the maDMP JSON file."
        required: true
        type: string
      fair_publish_version:
        description: "PyPI version of fair-publish to install."
        required: false
        type: string
        default: "latest"
    outputs:
      passed:
        description: "True if all error-level rules passed."
        value: ${{ jobs.validate.outputs.passed }}

jobs:
  validate:
    name: Validate maDMP
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch org-level policy
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: _org_policy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fair-publish
        run: pip install git+https://github.com/in-silico-institute/fair-publish.git

      - name: Validate
        id: validate
        run: |
          if fair-publish validate "${{ inputs.dmp_path }}" \
               --policy _org_policy/.github/policies/fair-policy.yml; then
            echo "passed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write step summary
        if: always()
        run: |
          echo "## FAIR Validation Report" >> "$GITHUB_STEP_SUMMARY"
          fair-publish report "${{ inputs.dmp_path }}" \
            --policy _org_policy/.github/policies/fair-policy.yml --format json \
          | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          icon = '✅' if r['passed'] else '❌'
          print(f\"{icon} **{'PASSED' if r['passed'] else 'FAILED'}** — {r['total_errors']} errors, {r['total_warnings']} warnings\n\")
          for ds in r['datasets']:
              print(f\"### Dataset: {ds['title']}\")
              print('| Rule | FAIR | Status | Message |')
              print('|------|------|--------|---------|')
              for res in ds['results']:
                  st = '✓' if res['passed'] else ('✗' if res['severity']=='error' else '⚠')
                  print(f\"| {res['rule']} | {res['fair']} | {st} | {res['message']} |\")
              print()
          " >> "$GITHUB_STEP_SUMMARY"
