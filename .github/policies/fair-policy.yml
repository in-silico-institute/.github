# In-Silico Institute — FAIR metadata policy
# Applies to every dataset repository in the organisation.
# Edit here; all project repos inherit the change on next push.
# Bump version when rules change so zenodo_state.json records which
# policy version each dataset was last published under.

version: "1.0"

rules:
  - name: Creator ORCID present
    severity: error           # blocking — identity required

  - name: License present and recognized
    severity: error

  - name: At least one keyword
    severity: error           # blocking — discoverability required

  - name: Description length
    severity: warning
    config:
      min_chars: 150

  - name: Access rights stated
    severity: error

  - name: Dataset identifier present
    severity: error

# Domain-specific rules — uncomment to enable
# extra_rules:
#   - module: myorg_rules.biomedical
#     class: SnomedCtKeyword
#     severity: error

targets:
  - zenodo
